packages:
    - "apps/*"
    - "packages/*"

allowBuilds:
    "@parcel/watcher": false
    "@prisma/engines": true
    "@scarf/scarf": true
    msgpackr-extract: true
    prisma: true
    sharp: true
    unrs-resolver: true

overrides:
    tinypool: ^2.2.0
    postcss: ^8.5.31
    multer: ^2.5.0
    js-yaml: ^5.5.0
    uuid: ^11.1.1
    postcss-selector-parser: ^7.1.6
