name: CI/CD Pipeline

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

concurrency:
    group: pipeline-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read
    packages: write

jobs:
    lint_test:
        name: Lint and Test
        runs-on: ubuntu-latest
        timeout-minutes: 20
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: admin
                    POSTGRES_PASSWORD: password
                    POSTGRES_DB: matching_hub
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U admin -d matching_hub"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 20
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 20
        env:
            DATABASE_URL: postgresql://admin:password@127.0.0.1:5432/matching_hub?schema=public
            DATABASE_DIRECT_URL: postgresql://admin:password@127.0.0.1:5432/matching_hub?schema=public
            REDIS_HOST: 127.0.0.1
            REDIS_PORT: 6379
            DASHBOARD_ADMIN_TOKEN: test-token
            SESSION_SECRET: test-secret-test-secret-test-secret
            NODE_ENV: test
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.5.2

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version-file: ".node-version"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Sync test database schema
              run: pnpm --filter api exec prisma migrate deploy

            - name: Lint
              run: pnpm lint

            - name: Build
              run: pnpm api:build

            - name: Run tests with coverage
              run: pnpm api:test:cov | tee coverage-output.txt

            - name: Publish coverage summary
              if: always()
              run: |
                  {
                    echo "## API test coverage"
                    echo '<details><summary>Full coverage report</summary>'
                    echo
                    echo '```'
                    cat coverage-output.txt
                    echo '```'
                    echo '</details>'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Run e2e tests
              run: pnpm api:test:e2e

    build_and_push:
        name: Build and Push Image (GHCR)
        runs-on: ubuntu-latest
        needs: lint_test
        if: github.event_name == 'push'
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository }}:latest
                      ghcr.io/${{ github.repository }}:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    # Production runs on the VPS in /srv/matching-man with a self-hosted
    # PostgreSQL + Redis (see /srv/matching-man/docker-compose.vps.yml there).
    # This job only hands the immutable image tag to the VPS; secrets and
    # migrations stay on the box, inside /home/namtt/ops/matching-man-deploy.sh.
    deploy_production:
        name: Deploy to Production (VPS)
        runs-on: ubuntu-latest
        needs: build_and_push
        if: github.event_name == 'push'
        timeout-minutes: 15
        concurrency:
            group: production-deploy
            cancel-in-progress: false
        steps:
            - name: Install deploy key
              env:
                  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
                  VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts

            - name: Roll out ${{ github.sha }}
              run: |
                  ssh -i ~/.ssh/deploy_key \
                      -o IdentitiesOnly=yes \
                      -o UserKnownHostsFile=~/.ssh/known_hosts \
                      -o ConnectTimeout=15 \
                      "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
                      "deploy ${{ github.sha }}"
